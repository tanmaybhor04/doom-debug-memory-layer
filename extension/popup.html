<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; font: 13px sans-serif; background: #0f0f14; color: #eee; }
    header { padding: 12px 14px; background: #6d28d9; font-weight: 700; display: flex; justify-content: space-between; }
    #stats { padding: 8px 14px; color: #a5b4fc; font-size: 12px; }
    #list { max-height: 320px; overflow-y: auto; padding: 0 10px 10px; }
    .item { background: #1b1b24; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    .meta { color: #888; font-size: 11px; margin-top: 4px; display: flex; justify-content: space-between; }
    .del { background: none; border: none; color: #f87171; cursor: pointer; font-size: 11px; }
    #clear { margin: 0 10px 12px; width: calc(100% - 20px); padding: 8px; background: #3b0d0d; color: #fca5a5; border: none; border-radius: 8px; cursor: pointer; }
    .empty { padding: 20px; text-align: center; color: #888; }
  </style>
</head>
<body>
  <header><span>Memory Layer</span><span id="count"></span></header>
  <div id="stats"></div>
  <div id="list"></div>
  <button id="clear">Clear all memories</button>
  <script src="popup.js"></script>
</body>
</html>
